<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<!-- ═══════════════════════════════════════════════════════════
     EDIT THESE FOR EACH VIDEO (and the matching <title>/og tags below)
     ═══════════════════════════════════════════════════════════ -->
<script>
  window.VIDEO = {
    eyebrow:     "Point Reyes Productions · 2026",
    title:       "Catch You Later",
    description: "San Francisco, summer 1994. A 10-year-old boy spots his father's taxi, Car 20, rolling through the city, and chases it on his bike. He has only seen his dad a handful of times, and this time he isn't letting him get away. Catch You Later is a story about distance, longing, and the one chase that mattered.",
    src:         "video_1080.mp4",   // plays everywhere (H.264)
    srcFull:     "",        // full resolution (offered only where the device can decode it)
    poster:      "poster.jpg"    // still frame shown before play
  };
</script>

<title>Catch You Later — Point Reyes Productions</title>
<meta name="description" content="San Francisco, summer 1994. A boy spots his father's taxi and chases it on his bike. A story about distance, longing, and the one chase that mattered.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Point Reyes Productions">
<meta property="og:url" content="https://pointreyesproductions.github.io/watch/">
<meta property="og:title" content="Catch You Later">
<meta property="og:description" content="San Francisco, summer 1994. A boy spots his father's taxi and chases it on his bike. A story about distance, longing, and the one chase that mattered.">
<meta property="og:image" content="https://pointreyesproductions.github.io/watch/og.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A man smiling from the driver's seat of a red and green cab at dusk">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Catch You Later">
<meta name="twitter:image" content="https://pointreyesproductions.github.io/watch/og.jpg">
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@125,700;125,800&family=Inter:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#000; --fg:#fff; --gray:#8c8c8c; --dim:#4a4a4a; --line:rgba(255,255,255,.14);
    --display:"Archivo", "Helvetica Neue", Arial, sans-serif;
    --body:"Inter", -apple-system, "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--fg)}
  body{
    font-family:var(--body);-webkit-font-smoothing:antialiased;
    min-height:100vh;display:flex;flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    opacity:0;animation:in .9s ease .05s forwards;
  }
  @keyframes in{to{opacity:1}}

  /* ── Wordmark ── */
  header{display:flex;justify-content:center;padding:28px 20px 26px}
  .mark{
    font-family:var(--display);font-stretch:125%;font-weight:800;
    font-size:13px;letter-spacing:.38em;color:var(--fg);text-decoration:none;
    display:flex;align-items:center;gap:.75em;
  }
  .mark span{margin-right:-.38em}
  .mark i{width:7px;height:7px;border-radius:50%;background:var(--fg);display:block}

  /* ── Player ── */
  main{flex:1;width:100%;max-width:1280px;margin:0 auto;padding:0 clamp(0px,3vw,40px)}
  .player{
    position:relative;width:100%;aspect-ratio:16/9;background:#050505;overflow:hidden;
    margin:0 auto;cursor:pointer;user-select:none;-webkit-user-select:none;
  }
  .player{max-width:calc(70vh * var(--ar, 1.7778))}
  .player.vertical{max-width:calc(78vh * var(--ar))}
  .player video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}

  .big-play{
    position:absolute;inset:0;margin:auto;width:86px;height:86px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.85);background:rgba(0,0,0,.25);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:grid;place-items:center;transition:transform .35s ease,opacity .35s ease,background .25s;
  }
  .big-play svg{width:24px;height:24px;margin-left:4px;fill:#fff}
  .player:hover .big-play{transform:scale(1.06);background:rgba(255,255,255,.08)}
  .player.playing .big-play,.player.started .big-play{opacity:0;pointer-events:none;transform:scale(.9)}

  .spinner{position:absolute;inset:0;margin:auto;width:34px;height:34px;border-radius:50%;
    border:1.5px solid rgba(255,255,255,.2);border-top-color:#fff;opacity:0;transition:opacity .2s;
    animation:spin .9s linear infinite;pointer-events:none}
  .player.waiting .spinner{opacity:1}
  @keyframes spin{to{transform:rotate(360deg)}}

  .controls{
    position:absolute;left:0;right:0;bottom:0;padding:40px 18px 14px;
    background:linear-gradient(transparent,rgba(0,0,0,.75));
    display:flex;flex-direction:column;gap:10px;
    opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease;
    cursor:default;
  }
  .player:not(.started) .controls{pointer-events:none}
  .player.started .controls{opacity:1;transform:none}
  .player.started.idle .controls{opacity:0;transform:translateY(6px);pointer-events:none}
  .player.started.idle{cursor:none}

  .track{position:relative;height:16px;display:flex;align-items:center;cursor:pointer;touch-action:none}
  .bar{position:relative;width:100%;height:2px;background:rgba(255,255,255,.2);transition:height .2s}
  .track:hover .bar,.track.drag .bar{height:4px}
  .buf,.fill{position:absolute;left:0;top:0;bottom:0;width:0}
  .buf{background:rgba(255,255,255,.28)}
  .fill{background:#fff}
  .knob{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;
    background:#fff;transform:scale(0);transition:transform .2s}
  .track:hover .knob,.track.drag .knob{transform:scale(1)}

  .row{display:flex;align-items:center;gap:14px}
  .btn{background:none;border:0;color:#fff;cursor:pointer;width:30px;height:30px;display:grid;place-items:center;opacity:.9}
  .btn:hover{opacity:1}
  .btn svg{width:18px;height:18px;fill:#fff}
  .time{font-size:12px;font-variant-numeric:tabular-nums;letter-spacing:.04em;color:rgba(255,255,255,.85)}
  .btn.q{width:auto;padding:0 10px;font:600 10px/1 var(--body);letter-spacing:.2em;opacity:.55;border:1px solid rgba(255,255,255,.3);height:24px;border-radius:2px}
  .btn.q.on{opacity:1;background:#fff;color:#000;border-color:#fff}
  .btn.q[hidden]{display:none}
  .spacer{flex:1}
  .hide{display:none}


  /* ── End card: fade to black → logo ── */
  .endcard{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity 1.4s ease;cursor:default;z-index:5}
  .player.ended .endcard{opacity:1;pointer-events:auto}
  .player.ended .controls,.player.ended .big-play{opacity:0!important;pointer-events:none}
  .logo{display:flex;align-items:center;gap:clamp(10px,1.6vw,22px);
    font-family:var(--display);font-stretch:125%;font-weight:800;font-size:clamp(20px,4.4vw,58px);letter-spacing:.32em;line-height:1}
  .logo .w{display:block;opacity:0;transition:opacity 1.1s ease,transform 1.4s cubic-bezier(.2,.7,0,1)}
  .logo .w:first-child{transform:translateX(40%);margin-right:-.32em}
  .logo .w:last-child{transform:translateX(-40%);margin-right:-.32em}
  .logo .dot{width:clamp(8px,1.1vw,14px);height:clamp(8px,1.1vw,14px);border-radius:50%;background:#fff;flex:none;
    transform:scale(0);transition:transform .9s cubic-bezier(.3,1.4,.5,1)}
  .sub{margin-top:clamp(14px,2vw,24px);font-size:clamp(9px,1vw,12px);font-weight:500;letter-spacing:.62em;padding-left:.62em;
    text-transform:uppercase;color:var(--gray);opacity:0;transition:opacity 1.2s ease}
  .after{position:absolute;bottom:clamp(16px,4%,34px);left:0;right:0;display:flex;justify-content:center;gap:28px;
    opacity:0;transition:opacity 1s ease}
  .after button,.after a{white-space:nowrap;background:none;border:0;color:var(--dim);font:500 11px/1 var(--body);letter-spacing:.24em;
    text-transform:uppercase;text-decoration:none;cursor:pointer;padding:10px 4px;transition:color .2s}
  .after button:hover,.after a:hover{color:#fff}
  .player.ended .logo .dot{transform:scale(1);transition-delay:1.3s}
  .player.ended .logo .w{opacity:1;transform:none;transition-delay:1.9s}
  .player.ended .sub{opacity:1;transition-delay:2.9s}
  .player.ended .after{opacity:1;transition-delay:4.2s}
  @media (prefers-reduced-motion:reduce){.logo .w,.logo .dot{transition-duration:.01s!important;transform:none}}

  /* ── Info ── */
  .info{max-width:760px;margin:0 auto;padding:44px 22px 0;text-align:center}
  .eyebrow{font-size:11px;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--dim);margin-bottom:18px}
  h1{
    font-family:var(--display);font-stretch:125%;font-weight:800;text-transform:uppercase;
    font-size:clamp(26px,4.6vw,52px);line-height:1.02;letter-spacing:-.01em;
  }
  .desc{margin-top:20px;font-size:16px;line-height:1.65;color:var(--gray);max-width:620px;margin-left:auto;margin-right:auto}

  footer{padding:80px 20px 34px;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
  footer a{color:var(--dim);text-decoration:none;transition:color .2s}
  footer a:hover{color:#fff}

  @media (max-width:640px){
    header{padding:22px 16px 20px}
    main{padding:0}
    .info{padding-top:30px}
    .controls{padding:30px 12px 10px}
    .big-play{width:70px;height:70px}
    .after{gap:0}
    .after a{display:none}
    .after button{font-size:10px;white-space:nowrap}
  }
</style>
</head>
<body>

<header>
  <a class="mark" href="https://pointreyesproductions.com"><span>POINT</span><i></i><span>REYES</span></a>
</header>

<main>
  <div class="player" id="player">
    <video id="v" playsinline preload="metadata" controlslist="nodownload" disablepictureinpicture></video>
    <div class="spinner"></div>
    <div class="big-play" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 4l15 8-15 8z"/></svg></div>

    <div class="controls" id="controls">
      <div class="track" id="track" aria-label="Seek">
        <div class="bar"><div class="buf" id="buf"></div><div class="fill" id="fill"></div></div>
        <div class="knob" id="knob"></div>
      </div>
      <div class="row">
        <button class="btn" id="pp" aria-label="Play/Pause">
          <svg id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>
          <svg id="i-pause" class="hide" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
        </button>
        <span class="time"><span id="cur">0:00</span> <span style="opacity:.45">/</span> <span id="dur">0:00</span></span>
        <span class="spacer"></span>
        <button class="btn q" id="q" type="button" aria-label="Switch to full resolution" hidden>FULL RES</button>
        <button class="btn" id="mute" aria-label="Mute">
          <svg id="i-vol" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="1.6" fill="none"/><path d="M4 9h4l5-4v14l-5-4H4z"/></svg>
          <svg id="i-muted" class="hide" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="1.6"/></svg>
        </button>
        <button class="btn" id="fs" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" stroke="#fff" stroke-width="1.6" fill="none"/></svg>
        </button>
      </div>
    </div>

    <div class="endcard" id="endcard">
      <div class="logo"><span class="w">POINT</span><span class="dot"></span><span class="w">REYES</span></div>
      <div class="sub">Productions</div>
      <div class="after">
        <button id="replay" type="button">Watch again</button>
        <a href="https://pointreyesproductions.com">pointreyesproductions.com</a>
      </div>
    </div>
  </div>

  <section class="info">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 id="title"></h1>
    <p class="desc" id="desc"></p>
  </section>
</main>

<footer>
  <a href="https://pointreyesproductions.com">© <span id="yr"></span> Point Reyes Productions</a>
</footer>

<script>
(function(){
  const C = window.VIDEO, $ = id => document.getElementById(id);
  const P = $('player'), V = $('v');

  // Fill content
  V.src = C.src; if (C.poster) V.poster = C.poster;
  $('eyebrow').textContent = C.eyebrow || ''; if(!C.eyebrow) $('eyebrow').style.display='none';
  $('title').textContent = C.title || '';
  $('desc').textContent = C.description || ''; if(!C.description) $('desc').style.display='none';
  $('yr').textContent = new Date().getFullYear();

  // Full-res switch: only where the browser claims HEVC support; falls back automatically if it fails
  const Q = $('q'); let full = false;
  let hevc = ''; try { hevc = V.canPlayType('video/mp4; codecs="hvc1.1.6.L180.B0"') || V.canPlayType('video/mp4; codecs="hvc1"'); } catch(e){}
  if (C.srcFull && hevc) Q.hidden = false;
  const swap = (src, on) => { const t = V.currentTime, go = !V.paused;
    full = on; Q.classList.toggle('on', on); V.src = src; V.load();
    V.addEventListener('loadedmetadata', function f(){ V.removeEventListener('loadedmetadata', f);
      if (t) V.currentTime = t; if (go) V.play().catch(()=>{}); }); };
  Q.addEventListener('click', () => swap(full ? C.src : C.srcFull, !full));
  V.addEventListener('error', () => { if (full) { swap(C.src, false); Q.hidden = true; } });

  const fmt = s => { if(!isFinite(s)) return '0:00'; s=Math.floor(s);
    const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=String(s%60).padStart(2,'0');
    return h ? `${h}:${String(m).padStart(2,'0')}:${x}` : `${m}:${x}`; };

  // Fit vertical / square videos
  V.addEventListener('loadedmetadata', () => {
    $('dur').textContent = fmt(V.duration);
    if (V.videoWidth && V.videoHeight) {
      const ar = V.videoWidth / V.videoHeight;
      P.style.aspectRatio = ar;
      P.style.setProperty('--ar', ar);
      if (ar < 1.2) P.classList.add('vertical');
    }
  });

  const toggle = () => V.paused ? V.play() : V.pause();
  V.addEventListener('play', () => { P.classList.add('playing','started'); $('i-play').classList.add('hide'); $('i-pause').classList.remove('hide'); nudge(); });
  V.addEventListener('pause', () => { P.classList.remove('playing','idle'); $('i-play').classList.remove('hide'); $('i-pause').classList.add('hide'); });
  V.addEventListener('waiting', () => P.classList.add('waiting'));
  ['playing','canplay','pause'].forEach(e => V.addEventListener(e, () => P.classList.remove('waiting')));
  V.addEventListener('ended', () => {
    P.classList.remove('idle');
    P.classList.add('ended');
  });
  $('replay').addEventListener('click', e => { e.stopPropagation(); P.classList.remove('ended'); V.currentTime = 0; V.play(); });
  $('endcard').addEventListener('click', e => e.stopPropagation());
  V.addEventListener('seeking', () => { if (V.currentTime < V.duration - .2) P.classList.remove('ended'); });

  // Click video area = play/pause (not controls)
  P.addEventListener('click', e => { if (!e.target.closest('.controls') && !P.classList.contains('ended')) toggle(); });
  $('pp').addEventListener('click', toggle);

  // Progress
  const paint = () => {
    const d = V.duration || 0, p = d ? V.currentTime / d : 0;
    $('fill').style.width = (p*100)+'%'; $('knob').style.left = (p*100)+'%';
    $('cur').textContent = fmt(V.currentTime);
    if (V.buffered.length && d) $('buf').style.width = (V.buffered.end(V.buffered.length-1)/d*100)+'%';
  };
  V.addEventListener('timeupdate', paint); V.addEventListener('progress', paint);

  // Scrub
  const T = $('track');
  const seekTo = e => { const r = T.getBoundingClientRect();
    const p = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    if (V.duration) { V.currentTime = p * V.duration; paint(); } };
  T.addEventListener('pointerdown', e => { T.setPointerCapture(e.pointerId); T.classList.add('drag'); seekTo(e); });
  T.addEventListener('pointermove', e => { if (T.classList.contains('drag')) seekTo(e); });
  T.addEventListener('pointerup', () => T.classList.remove('drag'));

  // Mute
  const syncMute = () => { $('i-vol').classList.toggle('hide', V.muted); $('i-muted').classList.toggle('hide', !V.muted); };
  $('mute').addEventListener('click', () => { V.muted = !V.muted; syncMute(); });

  // Fullscreen (iOS falls back to native)
  $('fs').addEventListener('click', () => {
    if (document.fullscreenElement || document.webkitFullscreenElement) {
      (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else if (P.requestFullscreen) P.requestFullscreen();
    else if (P.webkitRequestFullscreen) P.webkitRequestFullscreen();
    else if (V.webkitEnterFullscreen) V.webkitEnterFullscreen();
  });

  // Auto-hide controls while playing
  let t;
  function nudge(){ P.classList.remove('idle'); clearTimeout(t);
    t = setTimeout(() => { if (!V.paused && !T.classList.contains('drag')) P.classList.add('idle'); }, 2400); }
  P.addEventListener('pointermove', nudge); P.addEventListener('touchstart', nudge, {passive:true});

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'k') { e.preventDefault(); toggle(); }
    else if (k === 'f') $('fs').click();
    else if (k === 'm') $('mute').click();
    else if (k === 'arrowright') V.currentTime += 5;
    else if (k === 'arrowleft') V.currentTime -= 5;
    else return;
    nudge();
  });

  V.addEventListener('contextmenu', e => e.preventDefault());
})();
</script>
</body>
</html>
