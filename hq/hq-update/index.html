<title>Point Reyes HQ</title>

<style>
/* Layout: one cinematic plate on top (the room you're standing in), a rail of rooms beneath it, then that room's working detail. Single committed night look. */
:root{
  --night:#0e0d0b;          /* ground */
  --night-2:#16140f;        /* raised surfaces */
  --plaster:#ecdfc6;        /* primary text, lime plaster */
  --plaster-dim:#ecdfc699;
  --plaster-faint:#ecdfc626;
  --walnut:#7a4f33;
  --amber:#e0b06a;          /* accent: cove light */
  --river:#8fb0a4;          /* secondary: river water */
  --ok:#93b483; --warn:#e0b06a; --alert:#d27a5c;
  --flap:#0a0908;
  --display:"Marcellus","Iowan Old Style","Palatino Linotype",Palatino,serif;
  --body:"Hanken Grotesk","Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--night);color:var(--plaster)}
body{font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px;max-width:1500px;margin:0 auto;display:grid;gap:18px}

/* Masthead */
.mast{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.brand h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,2.4vw,28px);letter-spacing:.28em;margin:0;text-transform:uppercase}
.brand span{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--plaster-dim)}
.meta{display:flex;align-items:center;gap:14px;font-family:var(--mono);font-size:12px;color:var(--plaster-dim);font-variant-numeric:tabular-nums}
.chip{font-family:var(--body);font-size:10px;letter-spacing:.22em;text-transform:uppercase;border:1px solid var(--plaster-faint);padding:4px 10px;border-radius:999px;color:var(--amber)}

/* Stage */
.stage-box{display:flex;justify-content:center}
.stage{position:relative;width:min(100%,calc(78vh * 16 / 9));aspect-ratio:16/9;max-width:100%;overflow:hidden;border-radius:6px;background:#000;box-shadow:0 30px 80px -30px #000}
.room{position:absolute;inset:0;opacity:0;transition:opacity .9s ease;transform-origin:50% 55%}
.room.on{opacity:1;animation:drift 26s ease-out forwards}
@keyframes drift{from{transform:scale(1.035)}to{transform:scale(1)}}
.room.still{animation:none;transition:none}
.ext{position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:0 30px 40px -10px #000}
.ext img,.ext .cv{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.ext .cv{opacity:0}.ext .walk-cap{z-index:1}
.flash{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 25%,#fffaf0,#ffe6bd 70%)}
.holo{width:1000px;height:425px;position:relative;perspective:900px}
.beam{position:absolute;bottom:0;width:70px;transform:translateX(-50%);background:linear-gradient(to top,#ffd08a70,#ffd08a00);filter:blur(10px);border-radius:50%}
.hp{position:absolute;width:175px;box-sizing:border-box;padding:12px 14px;border:1px solid #ffe2b38c;border-radius:10px;background:linear-gradient(180deg,#3a250f8c,#3a250f4d);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);color:#fff7e8;font-family:var(--body);text-shadow:0 0 10px #ffb84d99;box-shadow:0 0 34px #ffb84d40,inset 0 0 18px #ffd9a026;transform:rotateY(var(--ry));animation:bob 6s ease-in-out infinite}
.hp small{display:block;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:#ffd08a}
.hp b{display:block;font:400 28px/1.15 var(--display);margin:4px 0 3px}
.hp span{display:block;font-size:13px;line-height:1.3;color:#fff7e8cc}
@keyframes bob{50%{translate:0 -8px}}
.walk{position:absolute;inset:0;z-index:2;opacity:0;transition:opacity .35s ease;background:#000}
.walk.in{opacity:1}.walk.out{opacity:0}
.walk video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.walk-cap{position:absolute;left:clamp(10px,2%,24px);bottom:clamp(10px,3%,26px);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--plaster-dim);text-shadow:0 1px 12px #000}
.walk-cap b{display:block;font:400 clamp(15px,2.2vw,30px) var(--display);letter-spacing:.14em;color:var(--plaster);margin-top:4px}
.room img,.room video.plate{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:cover}
.tint{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 40%,transparent 40%,#00000080 100%)}
.screen{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;color:var(--plaster);font-family:var(--body)}
.label{position:absolute;left:clamp(10px,2%,24px);bottom:clamp(10px,3%,26px);display:flex;align-items:center;gap:10px;pointer-events:none;text-shadow:0 1px 12px #000}
.label b{font-family:var(--display);font-weight:400;font-size:clamp(15px,2.2vw,30px);letter-spacing:.14em;text-transform:uppercase}
.nav-arrow{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid #ecdfc640;background:#0e0d0b66;color:var(--plaster);font-size:18px;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px);z-index:3}
.nav-arrow:hover{background:#0e0d0bb3}
.nav-arrow:focus-visible,.rail button:focus-visible,.btn:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.briefback{position:absolute;top:12px;left:12px;z-index:5;font:600 clamp(13px,1.6vw,22px) var(--display);letter-spacing:.14em;text-transform:uppercase;text-decoration:none;color:var(--amber);background:#0e0d0bcc;border:1px solid var(--amber);border-radius:999px;padding:.55em 1.1em;backdrop-filter:blur(6px)}
.briefback:hover,.briefback:focus-visible{background:var(--amber);color:#0e0d0b;outline:none;transform:scale(1.06)}
.prev{left:max(10px,env(safe-area-inset-left,0px))}.next{right:max(10px,env(safe-area-inset-right,0px))}

/* status light */
.light{width:9px;height:9px;border-radius:50%;flex:none;background:var(--plaster-faint)}
.light.working{background:var(--amber);box-shadow:0 0 10px var(--amber);animation:pulse 2.4s ease-in-out infinite}
.light.waiting{background:var(--river);box-shadow:0 0 10px var(--river);animation:pulse 1.4s ease-in-out infinite}
.light.done{background:var(--ok)}
@keyframes pulse{50%{opacity:.35}}

/* Rail */
.rail{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.rail button{flex:1 0 auto;min-width:118px;display:flex;align-items:center;gap:9px;padding:9px 12px;border-radius:8px;border:1px solid var(--plaster-faint);background:var(--night-2);color:var(--plaster-dim);font:500 12px/1.2 var(--body);letter-spacing:.04em;cursor:pointer;text-align:left}
.rail button[aria-current="true"]{color:var(--plaster);border-color:var(--amber);background:#221d15}
.rail button:hover{color:var(--plaster)}

/* Detail */
.detail{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr);gap:28px;align-items:start;padding-top:6px}
@media (max-width:860px){.detail{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--amber)}
.detail h2{font-family:var(--display);font-weight:400;font-size:clamp(26px,3.2vw,40px);letter-spacing:.06em;margin:6px 0 10px;text-wrap:balance}
.agent{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--plaster-dim)}
.now{margin:16px 0 0;padding:14px 16px;border-left:2px solid var(--amber);background:var(--night-2);border-radius:0 6px 6px 0;max-width:60ch}
.now small{display:block;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--plaster-dim);margin-bottom:4px}
.rows{display:grid;gap:0;border-top:1px solid var(--plaster-faint)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:12px 2px;border-bottom:1px solid var(--plaster-faint);align-items:center}
.row .t{font-weight:500;min-width:0}
.row .s{font-size:12.5px;color:var(--plaster-dim);grid-column:1}
.row .r{grid-row:1 / span 2;grid-column:2;font-family:var(--mono);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.06em;padding:3px 8px;border-radius:3px;color:var(--flap)}
.st-cut,.st-boarding{background:var(--warn)}.st-review{background:var(--plaster)}.st-delivered{background:var(--ok)}.st-delayed{background:var(--alert);color:var(--plaster)}.st-waiting{background:var(--river)}
.bars{display:grid;gap:10px;margin-top:16px}
.bar{display:grid;grid-template-columns:76px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:12px;color:var(--plaster-dim)}
.bar i{display:block;height:6px;border-radius:3px;background:var(--plaster-faint);overflow:hidden}
.bar i b{display:block;height:100%;background:var(--amber)}
.bar span:last-child{font-family:var(--mono);text-align:right}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{font:600 11px var(--body);letter-spacing:.24em;text-transform:uppercase;padding:13px 22px;border-radius:999px;border:1px solid #ecdfc666;background:transparent;color:var(--plaster);cursor:pointer}
.btn.go{background:var(--amber);border-color:var(--amber);color:var(--flap)}
.btn:disabled{opacity:.35;cursor:default}
.foot{font-size:12px;color:var(--plaster-dim);display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between;border-top:1px solid var(--plaster-faint);padding-top:14px}
.foot button{background:none;border:0;color:var(--amber);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;transition:.35s;background:#221d15;border:1px solid var(--amber);padding:11px 18px;border-radius:999px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
.sound{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:21;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.sound-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--plaster-faint);background:#0e0d0bcc;backdrop-filter:blur(8px);color:var(--plaster);display:grid;place-items:center;cursor:pointer}
.sound-btn svg{width:17px;height:17px;stroke:var(--plaster);fill:none;stroke-width:1.6}
.sound-btn[aria-pressed="true"]{border-color:var(--amber);color:var(--amber)}
.sound-btn[aria-pressed="true"] svg{stroke:var(--amber)}
.sound-btn .off{display:none}
.sound-btn[aria-pressed="false"] .on{display:none}
.sound-btn[aria-pressed="false"] .off{display:block}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* On-screen content (logical px, scaled by the room's perspective) */
.board{width:1000px;height:430px;padding:30px 38px;box-sizing:border-box;background:linear-gradient(180deg,#0b0a09e6,#0b0a09f5)}
.bh{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #e0b06a55;padding-bottom:12px;font-size:13px;letter-spacing:.32em;color:var(--amber)}
.bh b{font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:.34em;color:var(--plaster)}
.bt{width:100%;border-collapse:separate;border-spacing:0 7px;margin-top:6px;font-family:var(--mono);font-size:19px}
.bt th{font:500 11px var(--body);letter-spacing:.28em;color:#ecdfc680;text-align:left;padding:2px 0}
.cells{display:inline-flex;gap:2px}
.cells i{font-style:normal;display:inline-block;width:.68em;text-align:center;background:var(--flap);padding:3px 1px;border-radius:2px;box-shadow:inset 0 -1px 0 #ffffff12, inset 0 1px 0 #000}
.stat i{color:var(--flap)}
.stat.st-cut i,.stat.st-boarding i{background:var(--warn)}.stat.st-review i{background:var(--plaster)}.stat.st-delivered i{background:var(--ok)}.stat.st-delayed i{background:var(--alert);color:var(--plaster)}.stat.st-waiting i{background:var(--river)}
.tick{position:absolute;left:0;right:0;bottom:0;padding:11px 38px;border-top:1px solid #e0b06a40;font-size:13px;letter-spacing:.14em;color:#ecdfc6bf;white-space:nowrap;overflow:hidden;background:#00000066}
.tick em{font-style:normal;color:var(--amber)}
.glass{width:600px;height:440px;padding:30px 34px;box-sizing:border-box;background:linear-gradient(160deg,#1b140dd9,#1b140da6);border:1px solid #f3d39d55;border-radius:18px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fbf4e6;text-shadow:0 1px 8px #0006}
.glass h3{font-family:var(--display);font-weight:400;font-size:30px;margin:4px 0 16px;letter-spacing:.06em}
.glass p{margin:0 0 12px;font-size:19px;line-height:1.35}
.glass small{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:#f3d39d}
.wallq{width:1000px;height:140px;display:flex;gap:18px;align-items:center;padding:0 26px;box-sizing:border-box;font-family:var(--mono)}
.wq{flex:1;border-left:2px solid var(--amber);padding-left:14px;color:#ecdfc6d9}
.wq small{display:block;font-size:13px;letter-spacing:.2em;color:var(--amber)}
.wq b{display:block;font-size:26px;font-weight:500;margin:4px 0}
.wq i{display:block;height:6px;background:#ecdfc626;border-radius:3px;overflow:hidden}.wq i u{display:block;height:100%;background:var(--amber)}
.sheet{width:1000px;height:380px;padding:28px 34px;box-sizing:border-box;background:#0c0b0aee;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.sheet h4{grid-column:1/-1;margin:0;font:400 24px var(--display);letter-spacing:.28em;color:var(--amber)}
.day{border-top:1px solid #e0b06a66;padding-top:12px;font-size:28px;line-height:1.2}
.day small{display:block;font-family:var(--mono);font-size:20px;margin-bottom:6px;color:var(--amber);letter-spacing:.14em}
.pipe{width:700px;height:740px;padding:34px;box-sizing:border-box;background:#0c0b0aee;font-family:var(--mono)}
.pipe h4{margin:0 0 20px;font:400 30px var(--display);letter-spacing:.24em;color:var(--amber)}
.stage-row{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid #ecdfc626;padding:16px 0;font-size:24px}
.stage-row b{font-size:44px;font-weight:500;color:var(--plaster)}
.feeds{width:1000px;height:470px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:6px;padding:4px;box-sizing:border-box}
.feed{background:#0c0b0ae6;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between;font-family:var(--mono);font-size:14px;color:#ecdfc6b3}
.feed b{font-size:30px;font-weight:500;color:var(--plaster)}
.feed.hot{background:#2a2013f0}.feed.hot b{color:var(--amber)}
.studio{width:760px;height:360px;display:flex;gap:8px;box-sizing:border-box}
.studio-reel{flex:1 1 52%;position:relative;background:#0c0b0ae6;border-radius:4px;overflow:hidden;display:grid;place-items:center}
.studio-vid{width:100%;height:100%;object-fit:cover;display:block}
.reel-empty{text-align:center;color:#ecdfc699;font-family:var(--body)}
.reel-empty small{display:block;font-size:13px;letter-spacing:.24em;text-transform:uppercase;margin-bottom:8px}
.reel-empty b{display:block;font-size:22px;font-weight:500;color:var(--plaster)}
.reel-empty span{display:block;font-size:14px;margin-top:6px;color:#ecdfc680}
.studio-side{flex:1 1 48%;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr);gap:6px}
.feeds.sm{width:auto;height:auto;grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr)}
.studio-side .feed,.feeds.sm .feed{padding:8px 10px;font-size:11px;letter-spacing:-.02em;min-width:0;overflow:hidden}
.studio-side .feed b,.feeds.sm .feed b{font-size:21px}
.vert{width:300px;height:560px;padding:20px;box-sizing:border-box;background:linear-gradient(180deg,#1d1812,#0c0b0a);display:flex;flex-direction:column;justify-content:space-between;font-family:var(--body)}
.vert small{font-family:var(--mono);font-size:16px;color:var(--amber);letter-spacing:.1em}
.vert b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1.15}
.vert span{font-size:16px;color:#ecdfc6a6}
.scr{width:1000px;height:372px;display:flex;background:#050403}.scr-vid{width:662px;height:372px;flex:none;background:#000;object-fit:contain;display:block}.scr-play{width:662px;height:372px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:var(--plaster);background:radial-gradient(ellipse at 50% 45%,#3b2f23,#100d0a 72%)}.scr-play i{font-style:normal;font-size:64px;color:var(--amber)}.scr-play small{font-size:15px;letter-spacing:.3em}.scr-play span{font-size:13px;color:#ecdfc699}.scr iframe{width:662px;height:372px;border:0;flex:none;pointer-events:auto}.scr-info{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 22px;gap:10px}.scr-info small{font-size:13px;letter-spacing:.3em;color:var(--amber)}.scr-info b{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.1em}.scr-info span{font-size:13px;letter-spacing:.2em;color:#ecdfc699}
.cine{width:1000px;height:372px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(ellipse at 50% 45%,#3b2f23,#100d0a 72%)}
.cine small{font-size:15px;letter-spacing:.42em;color:var(--amber)}
.cine b{font-family:var(--display);font-weight:400;font-size:52px;letter-spacing:.18em;margin:14px 0 10px}
.cine span{font-size:16px;letter-spacing:.3em;color:#ecdfc699}
.label em,.eyebrow em{font:500 10px var(--body);font-style:normal;letter-spacing:.24em;text-transform:uppercase;color:var(--plaster-dim);border:1px solid var(--plaster-faint);padding:2px 8px;border-radius:999px;margin-left:8px}
.label em:empty{display:none}
/* ---------- crew: every agent in its room ---------- */
.crew{position:absolute;right:clamp(10px,2%,24px);bottom:clamp(10px,3%,26px);display:flex;gap:clamp(6px,1vw,14px);pointer-events:none;z-index:3}
.crew:empty{display:none}
.mate{display:flex;flex-direction:column;align-items:center;gap:5px;width:clamp(54px,6.4vw,92px);text-align:center;text-shadow:0 1px 10px #000}
.face{position:relative;width:clamp(44px,5.4vw,78px);aspect-ratio:1;border-radius:50%;overflow:visible;background:#1a1612;border:1px solid #ecdfc640;box-shadow:0 6px 22px #0009}
.face img,.face video{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.face .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:clamp(14px,1.8vw,24px);letter-spacing:.06em;color:#ecdfc6cc;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3128,#14110e)}
.face .light{position:absolute;right:-1px;bottom:2px;width:clamp(10px,1vw,14px);height:clamp(10px,1vw,14px);border:2px solid #14110e}
.face .ask{position:absolute;left:-4px;top:-4px;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--amber,#f3b55b);color:#14110e;font:600 10px/18px var(--body);text-shadow:none}
.mate small{font:500 clamp(8px,.8vw,11px)/1.15 var(--body);letter-spacing:.08em;text-transform:uppercase;color:#fbf4e6dd;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.mapw{position:absolute;inset:0;pointer-events:auto}
.mapw svg{position:absolute;inset:0;width:100%;height:100%}

.cc.on{opacity:1}.cc b{color:var(--amber,#f3b55b);font-weight:600;margin-right:6px}.cc small{display:block;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:#ecdfc680;margin-bottom:4px}

.notes{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.notes[hidden]{display:none}
.scr-text{padding:18px 26px;font:400 17px/1.55 'IBM Plex Mono',monospace;color:#f4ead6;white-space:pre-wrap;overflow:hidden;height:100%;mask-image:linear-gradient(#000 80%,transparent)}
.plate-css.map{background:radial-gradient(ellipse at 50% 45%,#22301f 0%,#141c12 55%,#0b0f09 100%)}
.plate-css{position:absolute;inset:0;background:radial-gradient(ellipse at 30% 35%,#5a4330 0%,#2a2018 38%,#100c09 78%),#100c09}
.plate-css::after{content:attr(data-t);position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(28px,6vw,90px);letter-spacing:.2em;text-transform:uppercase;color:#ecdfc614;white-space:nowrap}
.crewlist{margin-top:18px;display:grid;gap:10px}
.cm{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:start;padding:10px 12px;border:1px solid #ecdfc61f;border-radius:12px;background:#ffffff06}

.chip.live{color:var(--ok);border-color:#93b48366}

.waterfx i{position:absolute;top:-60%;left:-40%;width:220%;height:260%;font-style:normal;background:repeating-linear-gradient(98deg,transparent 0 7%,rgba(255,244,221,.16) 8%,transparent 10% 19%),repeating-linear-gradient(98deg,transparent 0 11%,rgba(224,176,106,.1) 12%,transparent 14% 26%);mix-blend-mode:screen;filter:blur(.6px);animation:waterdrift 9s linear infinite}

@keyframes waterdrift{0%{transform:translate(0,0)}100%{transform:translate(8%,3%)}}

@media (prefers-reduced-motion:reduce){.room.on,.light.working,.light.waiting{animation:none}.room{transition:none}}

<script>
(function(){
/* ---------- sample state ---------- */
const DEFAULT = {
  projects:[],
  queue:[],
  decided:[]
};
let S;
try{ S = JSON.parse(localStorage.getItem('prhq-state')) || null }catch(e){ S=null }
if(!S) S = JSON.parse(JSON.stringify(DEFAULT));
const save=()=>{ if(LIVE.on) return; try{ localStorage.setItem('prhq-state',JSON.stringify(S)) }catch(e){} };

/* ---------- live data: the agents' shared database ----------
   hq/briefing        CEO's 6 AM briefing
   agents/<roomId>    each agent's status: {light, now, rows:[{t,s,r,tone}], updatedAt}
   board/projects     {items:[{id,name,div,status,due}]} for the atrium board
   screening/<id>     {title, note, from, status:'waiting'|'greenlit'|'sentback', createdAt, decidedAt}
   A room shows live data only once its agent has written; until then it says Sample. */
const LIVE={on:true,briefing:null,agents:{},roster:{},projects:null,screening:null};
const ALIAS={editbay:'edit-bay','edit_bay':'edit-bay',lookout:'business',writersroom:'writers','writers-room':'writers'};
const roomOf=id=>{const r=String((LIVE.roster||{})[id]||'').toLowerCase();return ALIAS[r]||r};
/* every agent whose roster room is this room; a room-keyed agent with no roster line still counts as that room's lead */
function crewOf(room){const A=LIVE.agents||{},out=[];Object.keys(A).forEach(id=>{const a=A[id];if(!a||typeof a!=='object')return;const r=roomOf(id)||(id===room?room:'');if(r===room)out.push(Object.assign({id},a))});return out.sort((x,y)=>(x.id===room?-1:y.id===room?1:0))}
const RANK={waiting:0,working:1,done:2,idle:3};
const topLight=C=>C.map(a=>LIGHTS.includes(a.light)?a.light:'idle').sort((a,b)=>RANK[a]-RANK[b])[0]||'idle';
const initials=n=>String(n||'?').replace(/^the\s+/i,'').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const safeUrl=u=>/^https:\/\//i.test(String(u||''))?String(u):'';
function faceHTML(a){const u=safeUrl(a.avatar),asks=(a.waitingOnMichael||[]).length;
  const media=u?(/\.(mp4|webm)(\?|$)/i.test(u)?`<video src="${esc(u)}" muted loop autoplay playsinline></video>`:`<img src="${esc(u)}" alt="" loading="lazy">`):'';
  return `<div class="face">${media||`<span class="ini">${esc(a.person?String(a.person)[0].toUpperCase():initials(a.name||a.id))}</span>`}<span class="light ${LIGHTS.includes(a.light)?a.light:'idle'}"></span>${asks?`<span class="ask">${asks}</span>`:''}</div>`}
function renderCrew(){document.querySelectorAll('[data-crew]').forEach(el=>{const C=LIVE.on?crewOf(el.dataset.crew):[];el.innerHTML=C.slice(0,6).map(a=>`<div class="mate">${faceHTML(a)}<small>${esc(a.person||a.name||a.id)}</small></div>`).join('')})}
const LBL={working:'Working',waiting:'Waiting on you',idle:'Standing by',done:'Done'};
/* ---------- voices: agents speak with the browser's own voices (free, no account); a line or conversation with an `audio` URL plays that file instead ---------- */
const hashS=s=>{let x=0;for(const c of String(s))x=(x*31+c.charCodeAt(0))>>>0;return x};
let unlocked=false;['pointerdown','keydown'].forEach(ev=>window.addEventListener(ev,()=>{unlocked=true},{once:true}));
function voiceFor(who){const vs=(window.speechSynthesis?speechSynthesis.getVoices():[]).filter(v=>/^en/i.test(v.lang));const a=Object.values(LIVE.agents||{}).find(x=>x&&(x.person===who||x.name===who))||{};const g=a.voice||'';
  let pool=vs; if(g==='female')pool=vs.filter(v=>/female|samantha|victoria|karen|moira|tessa|zira|aria|jenny|google us english/i.test(v.name)); if(g==='male')pool=vs.filter(v=>/male|daniel|alex|fred|david|guy|mark|google uk english male/i.test(v.name)&&!/female/i.test(v.name)); if(!pool.length)pool=vs;
  return pool.length?pool[hashS(who)%pool.length]:null}
function caption(room,who,text){const c=document.getElementById('cc');if(!c)return;if(!text){c.classList.remove('on');return}c.innerHTML=(room?`<small>Overheard · ${esc(room)}</small>`:'')+`<b>${esc(who)}</b>${esc(text)}`;c.classList.add('on')}
let talking=false;
function playLines(lines,room){if(!lines||!lines.length)return;stopTalk();talking=true;
  const cv=lines.audio;if(cv){const au=new Audio(cv);au.onended=()=>{talking=false;caption()};caption(room,lines[0].who,lines[0].text);au.play().catch(()=>{talking=false});return}
  if(!window.speechSynthesis){talking=false;return}
  lines.forEach((l,i)=>{const u=new SpeechSynthesisUtterance(String(l.text||''));const v=voiceFor(l.who);if(v)u.voice=v;const k=hashS(l.who);u.pitch=.82+(k%9)/25;u.rate=.98+(k%5)/50;
    u.onstart=()=>caption(room,l.who,l.text);if(i===lines.length-1)u.onend=()=>{talking=false;setTimeout(()=>caption(),1200)};speechSynthesis.speak(u)})}
function stopTalk(){try{speechSynthesis.cancel()}catch(e){}talking=false;caption()}
const OVH=()=>Array.isArray(LIVE.overheard)?LIVE.overheard:[];
function roomName(id){const r=R.find(x=>x.id===id);return r?r.name:id}
function overheardPanel(room){const L=OVH().map((o,i)=>Object.assign({i},o)).filter(o=>o.room===room);if(!L.length)return '';
  return `<div class="eyebrow" style="margin-top:22px">Overheard in this room</div><div class="ovh">${rowsHTML(L.map(o=>[o.title||((o.lines||[])[0]||{}).text||'Conversation',(o.lines||[]).map(l=>l.who).filter((v,i,a)=>a.indexOf(v)===i).join(' · '),`<button class="hear" type="button" data-ovh="${o.i}">▶ Listen</button>`]))}</div>`}
/* ambient: every few minutes, if the room you're standing in has a conversation, you hear it */
setInterval(()=>{if(!unlocked||talking||cur<0)return;const L=OVH().filter(o=>o.room===R[cur].id);if(!L.length)return;const o=L[Math.floor(Math.random()*L.length)];playLines(o.lines,roomName(o.room))},240000);
const MAP={marketing:[300,235],producer:[660,150],business:[1010,140],ceo:[1320,270],atrium:[800,450],newsroom:[1315,640],'edit-bay':[980,765],writers:[610,765],screening:[270,630]};
function mapHTML(){
  const roomsIn=Object.keys(MAP);
  const order=['atrium','marketing','producer','business','ceo','newsroom','edit-bay','writers','screening'];
  const path=order.map(id=>MAP[id]).map((p,i)=>(i?'L':'M')+p[0]+' '+p[1]).join(' ');
  const svg=`<svg viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true">
   <path d="M-20 80 C 300 200, 420 420, 760 470 S 1250 560, 1640 860" stroke="#3d6b78" stroke-opacity=".55" stroke-width="46" fill="none" stroke-linecap="round"/>
   <path d="M-20 80 C 300 200, 420 420, 760 470 S 1250 560, 1640 860" stroke="#8fc3cf" stroke-opacity=".18" stroke-width="10" fill="none"/>
   ${Array.from({length:70},(_,i)=>{const x=(i*233)%1600,y=(i*137)%900,r=18+(i*7)%30;return `<circle cx="${x}" cy="${y}" r="${r}" fill="#2d4a26" fill-opacity=".35"/>`}).join('')}
   <path d="${path}" stroke="#ecdfc6" stroke-opacity=".22" stroke-width="3" stroke-dasharray="2 10" fill="none" stroke-linecap="round"/></svg>`;
  const pods=roomsIn.map(id=>{const r=R.find(x=>x.id===id);if(!r)return '';const C=LIVE.on?crewOf(id):[];const [x,y]=MAP[id];
    const asks=id==='screening'?S.queue.length:C.reduce((n,a)=>n+((a.waitingOnMichael||[]).length),0);
    const talk=OVH().some(o=>o.room===id);
    const now=id==='screening'?(S.queue[0]?'Waiting: '+S.queue[0].title:'Now playing: '+NS().title):(r.now||'');
    return `<button class="pod${id==='atrium'?' big':''}" type="button" data-go="${id}" style="left:${x/16}%;top:${y/9}%">${asks?`<span class="need">${asks}</span>`:''}<h5><span class="light ${r.light}"></span>${esc(r.name)}${talk?'<span class="talk"><i></i><i></i><i></i></span>':''}</h5>${C.length?`<div class="fx">${C.slice(0,5).map(a=>faceHTML(a)).join('')}</div>`:''}${now?`<p>${esc(now)}</p>`:''}</button>`}).join('');
  return `<div class="mapw">${svg}<div class="maptitle">Point Reyes Productions · Portland Parish · from above</div>${pods}</div>`}
function stationsHTML(){const S2=(Array.isArray(LIVE.stations)?LIVE.stations:[]).slice(0,3);while(S2.length<3)S2.push({t:'Idle',s:'',pct:0});
  return `<div class="wallq">${S2.map((s,i)=>`<div class="wq"><small>STATION ${i+1}${s.who?' · '+esc(String(s.who).toUpperCase()):''}</small><b${s.t==='Idle'?' style="color:#ecdfc666"':''}>${esc(s.t)}</b><i><u style="width:${Math.max(0,Math.min(100,+s.pct||0))}%"></u></i></div>`).join('')}</div>`}
function lookoutHTML(){const A=LIVE.agents.business||{},rows=(A.rows||[]).slice(0,5);const pos=[[40,95,24],[225,20,12],[415,-5,0],[605,20,-12],[790,95,-24]];
  if(!rows.length)return `<div class="holo">${pos.map(([l,t,ry],i)=>`<div class="hp" style="left:${l}px;top:${t}px;--ry:${ry}deg;opacity:.55"><small>${['Radar','Pipeline','Today','Proof','Next'][i]}</small><b>—</b><span>${i===2?esc(A.now||'Standing by'):'No leads yet'}</span></div>`).join('')}</div>`;
  return `<div class="holo">${rows.map((x,i)=>{const [l,t,ry]=pos[i];return `<div class="hp" style="left:${l}px;top:${t}px;--ry:${ry}deg;animation-delay:-${i*1.3}s"><small>${esc(x.r||'LEAD')}</small><b style="font-size:20px">${esc(x.t||'')}</b><span>${esc(x.s||'')}</span></div>`}).join('')}</div>`}
const NS=()=>LIVE.nowShowing&&safeUrl(LIVE.nowShowing.src)?LIVE.nowShowing:{title:'Miles of Love',note:'A film dedicated to my son',src:'vid/miles-of-love.mp4',poster:'img/miles-of-love-poster.jpg'};
function crewPanel(room){const C=LIVE.on?crewOf(room):[];if(!C.length)return '';
  return `<div class="crewlist">${C.map(a=>`<div class="cm">${faceHTML(a)}<div><b>${esc(a.name||a.id)} · ${esc(LBL[a.light]||'Standing by')}</b>${a.does?`<div class="does">${esc(a.does)}</div>`:''}${a.now?`<div class="nowl">${esc(a.now)}</div>`:''}${(a.waitingOnMichael||[]).length?`<ul>${a.waitingOnMichael.slice(0,4).map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}${a.look&&!safeUrl(a.avatar)?`<div class="look">Casting: ${esc(a.look)}</div>`:''}${(a.say||a.now)?`<button class="hear" type="button" data-say="${esc(a.id)}">▶ Hear from ${esc(String(a.name||a.id).split(' ')[0])}</button>`:''}</div></div>`).join('')}</div>`}
let DB=null;
const TONE={cash:'st-cut',equity:'st-waiting',drift:'st-delayed',ok:'st-delivered',wait:'st-waiting',review:'st-review',hot:'st-boarding'};
function isLive(id){
  if(!LIVE.on) return false;
  if(id==='map') return true;
  if(id!=='screening'&&id!=='atrium'&&crewOf(id).length) return true;
  if(id==='ceo') return !!(LIVE.briefing||LIVE.agents.ceo);
  if(id==='atrium') return !!LIVE.projects;
  if(id==='screening') return true;
  return !!LIVE.agents[id];
}
const when=iso=>{try{const d=new Date(iso);return isNaN(d)?'':d.toLocaleString([], {weekday:'short',hour:'numeric',minute:'2-digit'})}catch(e){return ''}};
const OFF={ceo:'First real briefing lands at 5:47 AM tomorrow.',business:'The Lookout comes online next: lead hunting and outreach drafts.',producer:'The Producer comes online in build step 4.','edit-bay':'The Editor comes online in build step 4, when your Mac is on.',marketing:'Marketing comes online in build step 2.',newsroom:'The Newsroom comes online in build step 2.'};
function offScreen(id){
  if(id==='edit-bay') return `<div class="wallq">${[1,2,3].map(n=>`<div class="wq"><small>STATION ${n}</small><b style="color:#ecdfc666">Idle</b><i><u style="width:0"></u></i></div>`).join('')}</div>`;
  if(id==='producer') return `<div class="sheet"><h4>THIS WEEK</h4><div class="day" style="grid-column:1/-1;color:#ecdfc666"><small>OFF DUTY</small>The Producer comes online in step 4</div></div>`;
  if(id==='business') return `<div class="holo">${[['Radar',40,95,24],['Pipeline',225,20,12],['Today',415,-5,0],['Proof',605,20,-12],['Best hour',790,95,-24]].map(([k,l,t,ry])=>`<div class="hp" style="left:${l}px;top:${t}px;--ry:${ry}deg;opacity:.55"><small>${k}</small><b>—</b><span>Off duty</span></div>`).join('')}</div>`;
  return '';
}
function newsHTML(){
  const A=LIVE.agents.newsroom, T=(A&&Array.isArray(A.tiles)?A.tiles:[]).slice(0,6);
  while(T.length<6) T.push({k:'—',v:'—'});
  return `<div class="feeds sm">${T.map(x=>{const v=String(x.v??'—');return `<div class="feed${x.hot?' hot':''}">${esc(String(x.k||'').toUpperCase())}<b${v.length>7?' style="font-size:15px"':''}>${esc(v)}</b></div>`}).join('')}</div>`;
}
function liveRows(list){return rowsHTML((list||[]).slice(0,12).map(x=>[x.t||'',x.s||'',x.tone&&TONE[x.tone]?`<span class="pill ${TONE[x.tone]}">${esc(x.r||x.tone.toUpperCase())}</span>`:esc(x.r||'')]))}

const cls = s => ({'IN CUT':'st-cut','BOARDING':'st-boarding','IN REVIEW':'st-review','DELIVERED':'st-delivered','DONE':'st-delivered','DELAYED':'st-delayed','DUE SOON':'st-delayed','SENT BACK':'st-delayed','WAITING':'st-waiting'})[s]||'st-review';
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const flap = (txt,len) => { const t=String(txt).toUpperCase().padEnd(len||txt.length,' ').slice(0,len||txt.length); return '<span class="cells">'+[...t].map(c=>'<i data-c="'+esc(c)+'">'+(c===' '?'&nbsp;':esc(c))+'</i>').join('')+'</span>'; };

/* ---------- rooms ----------
   quad = screen corners in the source image, as fractions of width/height: TL, TR, BR, BL */
const R = [
 {id:'map', name:"Bird's-eye", div:'The whole campus', agent:'Everyone', img:'', light:'working', now:'', screens:[{q:[[0,0],[1600,0],[1600,900],[0,900]],src:1600,w:1600,h:900,html:()=>mapHTML()}]},
 {id:'atrium', name:'The Atrium', div:'Common area', agent:'Chief of staff', img:'img/atrium.jpg',
  light:'working', now:'Keeping the departures board current across all three divisions.',

function daysTo(iso){const p=String(iso).split('-'),d=new Date(+p[0],+p[1]-1,+p[2]),t=new Date();t.setHours(0,0,0,0);return Math.round((d-t)/864e5)}

function deadlineState(b){const all=((b&&b.deadlines)||[]).map(x=>Object.assign({n:daysTo(x.due)},x));const open=all.filter(x=>!x.done&&x.n>=-1).sort((a,c)=>a.n-c.n);const done=all.filter(x=>x.done&&x.doneAt&&daysTo(x.doneAt)>=-1);return {open,done,soon:open.filter(x=>x.n<=2)}}

/* ---------- perspective fit ---------- */
function solve(A,b){const n=b.length;for(let i=0;i<n;i++){let m=i;for(let r=i+1;r<n;r++)if(Math.abs(A[r][i])>Math.abs(A[m][i]))m=r;[A[i],A[m]]=[A[m],A[i]];[b[i],b[m]]=[b[m],b[i]];for(let r=i+1;r<n;r++){const f=A[r][i]/A[i][i];for(let c=i;c<n;c++)A[r][c]-=f*A[i][c];b[r]-=f*b[i];}}const x=new Array(n);for(let i=n-1;i>=0;i--){let s=b[i];for(let c=i+1;c<n;c++)s-=A[i][c]*x[c];x[i]=s/A[i][i];}return x}
function matrixFor(w,h,q){const src=[[0,0],[w,0],[w,h],[0,h]];const A=[],b=[];for(let i=0;i<4;i++){const[x,y]=src[i],[u,v]=q[i];A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);}const[a,bb,c,d,e,f,g,hh]=solve(A,b);return `matrix3d(${a},${d},0,${g},${bb},${e},0,${hh},0,0,1,0,${c},${f},0,1)`}

  const PL=LIVE.plates||{};R.forEach(r=>{const p=PL[r.id];if(!p)return;const src=safeUrl(p.vid)||safeUrl(p.img);if(!src||r._plate===src)return;r._plate=src;
    const el=document.getElementById('room-'+r.id);if(!el)return;const old=el.querySelector(':scope > img, :scope > video.plate, :scope > .plate-css');if(!old)return;
    const nu=safeUrl(p.vid)?Object.assign(document.createElement('video'),{className:'plate',src:safeUrl(p.vid),poster:safeUrl(p.img)||'',muted:true,loop:true,playsInline:true,autoplay:el.classList.contains('on')}):Object.assign(document.createElement('img'),{src:safeUrl(p.img),alt:r.name});
    if(nu.tagName==='VIDEO'){nu.setAttribute('muted','');nu.setAttribute('playsinline','');nu.setAttribute('loop','')}old.replaceWith(nu)});
  syncLights();syncTags();renderScreens();renderCrew();fit();
  if(cur>=0&&!busy){detail.innerHTML=detailHTML(R[cur]);bindDetail();if(R[cur].id==='atrium')flapIn()}
}
(async()=>{
  try{
    for(let i=0;i<20&&!(window.claude&&window.claude.use);i++) await new Promise(r=>setTimeout(r,250));
    if(!(window.claude&&window.claude.use)) return;
    DB=await window.claude.use('db'); if(!DB) return;
    const err=()=>{};
    DB.doc('hq/briefing').onSnapshot(s=>{LIVE.briefing=s.exists?s.data():null;applyLive()},err);
    DB.doc('board/projects').onSnapshot(s=>{const d=s.exists&&s.data();LIVE.projects=d&&Array.isArray(d.items)&&d.items.length?d.items.slice(0,8).map(p=>({id:String(p.id||''),name:String(p.name||''),div:String(p.div||'SERVICES').toUpperCase(),status:String(p.status||'IN REVIEW').toUpperCase(),due:String(p.due||'')})):null;applyLive()},err);
    DB.collection('agents').onSnapshot(q=>{const m={};q.docs.forEach(d=>{if(d.exists)m[d.id]=d.data()});LIVE.agents=m;applyLive()},err);
    DB.collection('screening').orderBy('createdAt').limit(200).onSnapshot(q=>{LIVE.screening=q.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()}));applyLive()},err);
  }catch(e){}
})();

/* static feed: data.json is rewritten on each deploy from the real calendar, inbox and channel numbers */
/* Reads the live feed (/api/data, updated by the daily run) and the shipped data.json, and uses whichever is newer. */
async function getFeed(){let best=null;for(const u of ['/api/data','data.json']){try{const r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;const j=await r.json();if(j&&j.briefing&&(!best||String(j.generatedAt||'')>String(best.generatedAt||'')))best=j}catch(e){}}if(!best)throw 0;return best}
async function loadFeed(){
  try{
    const d=await getFeed();
    LIVE.briefing=d.briefing||null;
    LIVE.agents=d.agents||{};
    LIVE.roster=(d.roster&&typeof d.roster==='object')?d.roster:{};
    LIVE.overheard=Array.isArray(d.overheard)?d.overheard.slice(0,20):[];
    LIVE.plates=d.plates&&typeof d.plates==='object'?d.plates:{};
    LIVE.stations=Array.isArray(d.stations)?d.stations:null;
    LIVE.nowShowing=d.nowShowing&&typeof d.nowShowing==='object'?d.nowShowing:null;
    LIVE.projects=Array.isArray(d.projects)&&d.projects.length?d.projects.slice(0,8).map(p=>({id:String(p.id||''),name:String(p.name||''),div:String(p.div||'SERVICES').toUpperCase(),status:String(p.status||'IN REVIEW').toUpperCase(),due:String(p.due||'')})):null;
    LIVE.screening=Array.isArray(d.screening)?d.screening.filter(x=>x&&x.id):[];
  }catch(e){}
  applyNow();
}
loadFeed(); setInterval(loadFeed,300000);

renderScreens();
syncLights();
new ResizeObserver(fit).observe(stage);
fit();
go(location.hash.slice(1)||'map',false);
tick(); setInterval(tick,15000);
})();
